name: External raunchy flow historical screening (research only)
on:
  pull_request:
    paths:
      - 'research/external_raunchy_flow_audit.py'
      - 'research/external_raunchy_peak_comparison.py'
      - 'test_external_raunchy_peak_comparison.py'
      - '.github/workflows/external_raunchy_flow_audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Offline fail-closed regression tests
        run: python -m unittest -v test_external_raunchy_peak_comparison
      - name: Download public CC0 historical calls
        run: |
          curl --fail --location --retry 3 --max-time 120 \
            https://raw.githubusercontent.com/Smurfetc/solana-memecoin-calls-dataset/main/calls.jsonl \
            --output calls.jsonl
          test -s calls.jsonl
      - name: Execute frozen-name classifier research
        run: |
          python research/external_raunchy_flow_audit.py --input calls.jsonl --output external_raunchy_flow_audit.json
      - name: Execute descriptive name vs control peak comparison
        run: |
          python -m research.external_raunchy_peak_comparison --input calls.jsonl --output external_raunchy_peak_comparison.json
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-raunchy-flow-audit
          path: |
            external_raunchy_flow_audit.json
            external_raunchy_peak_comparison.json
          if-no-files-found: warn
