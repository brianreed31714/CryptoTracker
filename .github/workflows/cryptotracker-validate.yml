name: CryptoTracker Python Validation

on:
  push:
    branches: [main, feature/runner-paper-sleeve, feature/paper-goal-metrics-20261019, feature/paper-quality-audit-20261019]
    paths:
      - "*.py"
      - "research/**/*.py"
      - "SmartMoneyMonitor/**/*.py"
      - "restart_smartmoney_v23.ps1"
      - "retire_stale_smartmoney_v23.ps1"
      - ".github/workflows/cryptotracker-validate.yml"
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Smart Money test dependency
        run: python -m pip install requests python-dotenv
      - name: Validate credit-safe Smart Money observer
        run: |
          python -m py_compile SmartMoneyMonitor/solana_public_rpc_v23.py
          python -m py_compile SmartMoneyMonitor/smart_money_monitor_v2_2_1_campaign_strength.py
          python -m py_compile SmartMoneyMonitor/smart_money_monitor_v2_3_feed_health_audit.py
          python -m py_compile cryptotracker_supervisor.py
          python -m py_compile smart_money_dashboard_health.py
          python -m py_compile cryptotracker_dashboard_v11_8_2.py
          python -m unittest -v test_solana_public_rpc_v23 test_smart_money_dashboard_health
          python - <<'PY'
          from cryptotracker_supervisor import smart_money_settings
          script, enabled = smart_money_settings()
          assert enabled and script.endswith("smart_money_monitor_v2_3_feed_health_audit.py")
          print("Smart Money supervisor opt-in OK")
          PY
      - name: Public Solana RPC live connectivity (read only)
        run: |
          python - <<'PY'
          from SmartMoneyMonitor.solana_public_rpc_v23 import rpc
          slot = rpc("getSlot", [{"commitment": "confirmed"}])
          assert isinstance(slot, int) and slot > 0, f"Unexpected slot: {slot}"
          print("Public Solana RPC read-only getSlot OK:", slot)
          PY
      - name: Check Windows restart helper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($file in @("restart_smartmoney_v23.ps1", "retire_stale_smartmoney_v23.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($file + ": " + ($errors | Out-String)) }
          }
      - name: Compile protected Python files
        run: |
          python -m py_compile paper_research_lab_v11_10.py
          python -m py_compile research/runner_sleeve.py
          python -m unittest -v test_runner_hunter
          python -m py_compile publish_daily_evidence.py
          python -m py_compile build_daily_review_bundle.py
          python -m py_compile auto_trader_with_alerts_v11_10_research_fairness.py
      - name: Smoke test research module
        run: |
          python - <<'PY'
          import paper_research_lab_v11_10 as lab
          assert "anti_chase" in lab.MODEL_SPECS
          assert len(lab.MODEL_SPECS) >= 10
          print("models", sorted(lab.MODEL_SPECS))
          PY

  paper-goal-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify paper-only goals, execution quality and improvement diagnostics
        run: python -m unittest -v test_paper_goal_scorecard test_paper_quality_audit test_crypto_improvement_diagnostics test_paper_shadow_experiments test_novelty_shadow_research test_shadow_observation_integrity
      - name: Compile paper research
        run: python -m py_compile paper_research_lab_v11_10.py research/paper_goal_scorecard.py research/paper_quality_audit.py research/crypto_improvement_diagnostics.py research/paper_shadow_experiments.py publish_daily_evidence.py
