name: Strategy 16 shadow contract
on: [push, pull_request]
jobs:
  isolated-shadow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v test_strategy16_shadow
